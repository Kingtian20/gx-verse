  <body>
    <canvas id="action-bar-canvas"></canvas>

        <button title="Gxmes" id="gxmesBtn"><i class="fa-solid fa-gamepad actionbarBtn"></i></button>
        <button title="Info" id="infoBtn"><i class="fa-solid fa-address-book actionbarBtn"></i></button>
        <button title="Pr0xys" id="proxyBtn"><i class="fa-solid fa-cloud actionbarBtn"></i></button>
        <button title="Sound Board" id="soundboardBtn"><i class="fa-solid fa-volume actionbarBtn"></i></button>
      </div>
    </div>
    <canvas id="home-canvas"></canvas>

    <section class="home" id="home-page">
      <h1 class="main-title"><span class="g-circle">G</span>X VERSE</h1>
      <h1 class="sub-title main-title" style="font-size: 1rem; position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%)">Welcome to GX VERSE</h1>
      <div class="search-container">
        <div class="search-box">
          <div class="line-driver"></div>
          <input type="text" id="home-search" autocomplete="off" autofocus autocapitalize="off" autocorrect="off" placeholder="Search..." spellcheck="false" />
        </div>
      </div>
      <label class="version-label">Ver 0.0.3 BETA</label>
    </section>

    <section class="gxmes" id="gxmes-page" style="display: none; width: 100vw; height: 100vh; flex-direction: column; align-items: center; overflow-y: auto">
      <div class="search-wrapper">
        <div class="search-box">
          <div class="line-driver"></div>
          <input type="text" id="game-search" placeholder="Search gxmes..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
        </div>
      </div>

      <div class="grid" id="game-grid"></div>
    </section>

    <div id="game-overlay" class="game-overlay">
      <div id="game-frame-container"></div>

      <div class="game-controls">
        <button id="btn-fullscreen" title="Fullscreen"><i class="fa-solid fa-expand"></i></button>
        <button id="btn-exit" title="Exit"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>

    <script>
      const canvas = document.getElementById("home-canvas");
      const ctx = canvas.getContext("2d");

      let stars = [];
      let constellations = [];
      let shootingStars = [];
      let lastSpawn = Date.now();

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        createStars();
        createConstellations();
      }

      function createStars() {
        stars = Array.from({length: 200}, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 1.5 + 0.5,
          opacity: Math.random() * 0.9,
          speed: Math.random() * 0.02 + 0.005,
          phase: Math.random() * Math.PI * 2,
        }));
      }

      function createConstellations() {
        constellations = [];

        for (let i = 0; i < 5; i++) {
          const cx = Math.random() * canvas.width;
          const cy = Math.random() * canvas.height;

          const points = [];
          const connections = [];
          const count = Math.floor(Math.random() * 4) + 4;
          const radius = Math.random() * 80 + 60;

          for (let j = 0; j < count; j++) {
            const angle = (j / count) * Math.PI * 2 + Math.random() * 0.5;
            const dist = radius * (0.6 + Math.random() * 0.4);

            points.push({
              x: cx + Math.cos(angle) * dist,
              y: cy + Math.sin(angle) * dist,
            });
          }

          for (let j = 0; j < count; j++) {
            const next = (j + 1) % count;
            connections.push([j, next]);

            if (Math.random() > 0.5) {
              connections.push([j, (j + 2) % count]);
            }
          }

          constellations.push({points, connections});
        }
      }

      function createShootingStar() {
        return {
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height * 0.5,
          length: Math.random() * 80 + 60,
          speed: Math.random() * 3 + 2,
          angle: Math.PI / 4,
          opacity: 0.8,
        };
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        stars.forEach((s) => {
          s.phase += s.speed;
          const glow = (Math.sin(s.phase) + 1) / 1.5;

          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,255,${s.opacity * glow})`;
          ctx.fill();
        });

        constellations.forEach((c) => {
          ctx.strokeStyle = "rgba(255,255,255,0.16)";
          ctx.lineWidth = 1;

          c.connections.forEach(([a, b]) => {
            const p1 = c.points[a];
            const p2 = c.points[b];

            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
          });

          c.points.forEach((p) => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255,255,255,0.70)";
            ctx.fill();

            ctx.beginPath();
            ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255,255,255,0.2)";
            ctx.fill();
          });
        });

        const now = Date.now();
        if (now - lastSpawn > 1500 + Math.random() * 2000) {
          shootingStars.push(createShootingStar());
          lastSpawn = now;
        }

        shootingStars = shootingStars.filter((s) => {
          if (s.opacity <= 0) return false;

          const grad = ctx.createLinearGradient(s.x, s.y, s.x - Math.cos(s.angle) * s.length, s.y - Math.sin(s.angle) * s.length);

          grad.addColorStop(0, `rgba(255,255,255,${s.opacity})`);
          grad.addColorStop(1, "rgba(255,255,255,0)");

          ctx.beginPath();
          ctx.moveTo(s.x, s.y);
          ctx.lineTo(s.x - Math.cos(s.angle) * s.length, s.y - Math.sin(s.angle) * s.length);
          ctx.strokeStyle = grad;
          ctx.lineWidth = 2;
          ctx.stroke();

          s.x += Math.cos(s.angle) * s.speed;
          s.y += Math.sin(s.angle) * s.speed;
          s.opacity -= 0.01;

          return true;
        });

        requestAnimationFrame(draw);
      }

      window.addEventListener("resize", resize);

      resize();
      draw();
    </script>

    <script>
      const actionBarCanvas = document.getElementById("action-bar-canvas");
      const actionCtx = actionBarCanvas.getContext("2d");
      const barPod = document.getElementById("barPod");

      let barRotation = 0;

      function resizeActionBarCanvas() {
        actionBarCanvas.width = window.innerWidth;
        actionBarCanvas.height = window.innerHeight;
      }

      function renderActionBar() {
        if (!actionBarCanvas.width || !actionBarCanvas.height) {
          console.log("Canvas not sized yet");
          requestAnimationFrame(renderActionBar);
          return;
        }

        actionCtx.clearRect(0, 0, actionBarCanvas.width, actionBarCanvas.height);
        barRotation += 0.04;

        const b = barPod.getBoundingClientRect();

        actionCtx.fillStyle = "black";
        actionCtx.beginPath();
        actionCtx.roundRect(b.left, b.top, b.width, b.height, b.height / 2);
        actionCtx.fill();

        const centerX = b.left + b.width / 2;
        const centerY = b.top + b.height / 2;
        const grad = actionCtx.createConicGradient(barRotation, centerX, centerY);
        grad.addColorStop(0, "transparent");
        grad.addColorStop(0.1, "#0000ff");
        grad.addColorStop(0.2, "#00fff7");
        grad.addColorStop(0.3, "transparent");

        actionCtx.strokeStyle = grad;
        actionCtx.lineWidth = 3;
        actionCtx.shadowBlur = 2;
        actionCtx.shadowColor = "rgba(0, 0, 255, 0.8)";
        actionCtx.beginPath();
        actionCtx.roundRect(b.left, b.top, b.width, b.height, b.height / 2);
        actionCtx.stroke();

        requestAnimationFrame(renderActionBar);
      }

      window.addEventListener("resize", resizeActionBarCanvas);
      resizeActionBarCanvas();

      setTimeout(() => {
        resizeActionBarCanvas();
        renderActionBar();
      }, 100);
    </script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const homePage = document.getElementById("home-page");
        const gxmesPage = document.getElementById("gxmes-page");
        const homeBtn = document.getElementById("homeBtn");
        const gxmesBtn = document.getElementById("gxmesBtn");
        const buttons = [homeBtn, gxmesBtn];
        const mainTitle = document.querySelector(".main-title");
        const subTitle = document.querySelector(".sub-title");
        const homeSearch = document.getElementById("home-search");
        const gameSearch = document.getElementById("game-search");

        console.log("Buttons found:", homeBtn, gxmesBtn);

        let currentPage = "home";

      const pageMap = {
        home: {page: homePage, btn: homeBtn},
        gxmes: {page: gxmesPage, btn: gxmesBtn},
      };

      function updateButtons() {
        Object.keys(pageMap).forEach((pageName) => {
          const btn = pageMap[pageName].btn;
          if (pageName === currentPage) {
            btn.classList.add("active");
            btn.disabled = true;
            btn.style.cursor = "pointer";
            btn.style.pointerEvents = "none";
            btn.style.color = "var(--primary-color)";
            btn.style.transform = "translateY(-5px) scale(1.2)";
            btn.style.filter = "drop-shadow(0 0 10px var(--primary-color))";
          } else {
            btn.classList.remove("active");
            btn.disabled = false;
            btn.style.cursor = "";
            btn.style.pointerEvents = "";
            btn.style.color = "";
            btn.style.transform = "";
            btn.style.filter = "";
          }
        });
      }

      function switchPage(targetPage) {
        if (targetPage === currentPage) return;

        const prevPage = pageMap[currentPage].page;
        const nextPage = pageMap[targetPage].page;
        const canvas = document.getElementById("home-canvas");

        prevPage.style.display = "none";
        nextPage.style.display = "flex";
        nextPage.classList.remove("page-fade");
        void nextPage.offsetWidth;
        nextPage.classList.add("page-fade");

        if (targetPage === "home") {
          canvas.classList.remove("hidden");
        } else {
          canvas.classList.add("hidden");
        }

        currentPage = targetPage;
        updateButtons();

        if (targetPage === "home") {
          if (mainTitle) {
            mainTitle.style.animation = "none";
            void mainTitle.offsetWidth;
            mainTitle.style.animation = "glitch 2s infinite";
          }
          if (subTitle) {
            subTitle.style.animation = "none";
            void subTitle.offsetWidth;
            subTitle.style.animation = "glitch 2s infinite";
          }
        } else if (targetPage === "gxmes") {
          gameSearch.focus();
        }
      }

      function showDelayedTooltip(btn) {
        btn.classList.add("show-tooltip");
        setTimeout(() => {
          btn.classList.remove("show-tooltip");
        }, 300);
      }

      homeBtn.addEventListener("click", () => {
        console.log("Home button clicked");
        showDelayedTooltip(homeBtn);
        switchPage("home");
      });
      gxmesBtn.addEventListener("click", () => {
        console.log("Gxmes button clicked");
        showDelayedTooltip(gxmesBtn);
        switchPage("gxmes");
      });

      updateButtons();

      document.addEventListener("keydown", (e) => {
        const overlay = document.getElementById("game-overlay");

        if (e.key === "Escape" && overlay.classList.contains("active")) {
          e.preventDefault();
          document.getElementById("btn-exit").click();
          return;
        }

        if (e.target.tagName === "INPUT") return;

        if (e.key === "/") {
          e.preventDefault();
          if (currentPage === "home") {
            homeSearch.focus();
          } else if (currentPage === "gxmes") {
            gameSearch.focus();
          } else {
            switchPage("gxmes");
            setTimeout(() => gameSearch.focus(), 100);
          }
        }
      });

      homeSearch.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          gameSearch.value = homeSearch.value;
          gameSearch.dispatchEvent(new Event("input", {bubbles: true}));
          homeSearch.value = "";
          switchPage("gxmes");
        } else if (!/[a-zA-Z0-9 ]/.test(e.key)) {
          e.preventDefault();
        }
      });
      });
    </script>

    <script>
      function showToast(message, type = "info", duration = 4000) {
        const container = document.getElementById("toast-container");
        if (!container) {
          console.error("Toast container not found");
          return;
        }

        // Remove oldest toast if we have 5 or more
        const existingToasts = container.querySelectorAll(".toast");
        if (existingToasts.length >= 5) {
          const oldestToast = existingToasts[0];
          oldestToast.classList.add("hiding");
          oldestToast.addEventListener("animationend", () => {
            oldestToast.remove();
          });
        }

        const toast = document.createElement("div");
        toast.className = `toast ${type}`;

        const icons = {
          error: "fa-solid fa-xmark",
          warn: "fa-solid fa-exclamation-triangle",
          casual: "fa-solid fa-check",
          info: "fa-solid fa-info-circle"
        };

        toast.innerHTML = `
          <div class="toast-content">
            <i class="toast-icon ${icons[type] || icons.info}"></i>
            <span class="toast-message">${message}</span>
          </div>
        `;

        container.appendChild(toast);

        setTimeout(() => {
          toast.classList.add("hiding");
          toast.addEventListener("animationend", () => {
            toast.remove();
          });
        }, duration);
      }
    </script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const gameGrid = document.getElementById("game-grid");
        const searchInput = document.getElementById("game-search");
        const overlay = document.getElementById("game-overlay");
        const frameContainer = document.getElementById("game-frame-container");
        const globalActionBar = document.querySelector(".action-bar");

        let currentGame = null;
        let gamesList = [];

      async function fetchGames() {
        try {
          const response = await fetch("https://raw.githubusercontent.com/Kingtian20/gx-verse/main/gxmes/gxmes-list.json");
          const data = await response.json();
          gamesList = Array.isArray(data) ? data : (data ? [data] : []);
          gamesList.sort((a, b) => (a.name || "").localeCompare(b.name || "", undefined, {numeric: true, sensitivity: "base"}));
          renderGames(gamesList);
        } catch (error) {
          console.error("Failed to fetch games:", error);
          gameGrid.innerHTML = '<p style="color:white;text-align:center;font-family:Orbitron;">Failed to load games</p>';
        }
      }

      function renderGames(games) {
        gameGrid.innerHTML = "";
        games.forEach((game) => {
          const item = document.createElement("div");
          item.className = "game-item game-pop";
          item.onclick = () => openGameModal(game);
          item.innerHTML = `
            <img src="${game.image}" alt="${game.name}" loading="lazy">
            <div class="game-title">${game.name}</div>
          `;
          gameGrid.appendChild(item);
        });
      }

      function normalizeForSearch(str) {
        return str.toLowerCase().replace(/[^a-z0-9]/g, "");
      }

      let searchDebounce;
      searchInput.addEventListener("input", (e) => {
        clearTimeout(searchDebounce);
        searchDebounce = setTimeout(() => {
          const term = normalizeForSearch(e.target.value);
          renderGames(gamesList.filter((game) => normalizeForSearch(game.name).includes(term)));
        }, 250);
      });

      searchInput.addEventListener("keypress", (e) => {
        if (!/[a-zA-Z0-9 ]/.test(e.key)) {
          e.preventDefault();
        }
      });

      async function fetchText(url) {
        try {
          const response = await fetch(url);
          return await response.text();
        } catch (err) {
          console.error("Fetch failed:", err);
          return null;
        }
      }

      async function openGameModal(game) {
        currentGame = game;
        overlay.classList.add("active");
        globalActionBar.style.display = "none";
        frameContainer.innerHTML = '<div style="color:white; text-align:center; margin-top:20%; font-family:Orbitron;">LOADING...</div>';

        if (game.method === "code") {
          const fetchedCode = await fetchText(game.url);
          frameContainer.innerHTML = "";

          if (fetchedCode) {
            const wrapper = document.createElement("div");
            wrapper.id = "game-content-wrapper";
            wrapper.style.cssText = "width:100%; height:100%; overflow:auto; background:#000;";
            frameContainer.appendChild(wrapper);

            const baseUrl = game.url.substring(0, game.url.lastIndexOf("/") + 1);
            const patchedCode = fetchedCode.replace(/(src|href)=(["'])(?!https?:\/\/|data:|\/\/)([^"']+)\2/gi, `$1=$2${baseUrl}$3$2`);

            const parser = new DOMParser();
            const parsedDoc = parser.parseFromString(patchedCode, "text/html");

            parsedDoc.head.querySelectorAll("style").forEach((style) => {
              wrapper.appendChild(style.cloneNode(true));
            });

            parsedDoc.head.querySelectorAll("link[rel='stylesheet']").forEach((link) => {
              const newLink = document.createElement("link");
              newLink.rel = "stylesheet";
              newLink.href = link.href;
              wrapper.appendChild(newLink);
            });

            const bodyContent = document.createElement("div");
            bodyContent.innerHTML = parsedDoc.body.innerHTML;
            wrapper.appendChild(bodyContent);
            if (wrapper.dataset.scriptsLoaded) return;
            wrapper.dataset.scriptsLoaded = "true";

            parsedDoc.body.querySelectorAll("script").forEach((script) => {
              const newScript = document.createElement("script");
              if (script.src) {
                newScript.src = script.src;
              } else {
                newScript.textContent = script.textContent;
              }
              wrapper.appendChild(newScript);
            });
          }
        } else if (game.method === "webgl") {
          frameContainer.innerHTML = `
            <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:white; text-align:center; font-family:sans-serif; padding: 20px; width: 100%;">
              <h2 style="margin-bottom: 10px;">WebGL Mode</h2>
              <p style="opacity: 0.8; max-width: 400px; margin-bottom: 20px;">This game requires a new window to run correctly.</p>
              <button onclick="document.getElementById('btn-fullscreen').click()" style="padding: 15px 15px; background: #3066BE; color: white; border: none; border-radius: 100px; cursor: pointer; font-size: 20px; transition: 0.2s;"><i class="fa-solid fa-expand"></i></button>
            </div>
          `;
        } else {
          try {
            const code = await fetchText(game.url);
            frameContainer.innerHTML = "";
            const iframe = document.createElement("iframe");
            iframe.className = "newtab-iframe";
            iframe.setAttribute("allow", "autoplay; fullscreen; keyboard-events; gamepad");
            iframe.allowFullscreen = true;
            const blob = new Blob([code], {type: "text/html"});
            iframe.src = URL.createObjectURL(blob);
            frameContainer.appendChild(iframe);
          } catch (error) {
            console.error("Load error:", error);
            showToast("Failed to load game.", "error");
          }
        }
      }

      document.getElementById("btn-exit").addEventListener("click", () => {
        overlay.classList.remove("active");
        frameContainer.innerHTML = "";
        globalActionBar.style.display = "flex";
        currentGame = null;
      });

      document.getElementById("btn-fullscreen").addEventListener("click", async () => {
        if (!currentGame) return;

        const targetUrl = currentGame.url;
        const fetchedContent = await fetchText(targetUrl);

        if (fetchedContent) {
          const newWin = window.open("about:blank", "_blank");
          if (newWin) {
            newWin.document.open();
            newWin.document.write(fetchedContent);
            newWin.document.close();

            setTimeout(function () {
              const docEl = newWin.document.documentElement;
              const requestFs = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullscreen || docEl.msRequestFullscreen;
              if (requestFs) requestFs.call(docEl);
            }, 500);
          } else {
            showToast("Popup blocked! Please allow popups to launch the game.", "error");
          }
        }
      });

      fetchGames();
      });
    </script>
  </body>
</html>
